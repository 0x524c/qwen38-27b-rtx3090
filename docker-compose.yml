# Qwen3.8-27B on one RTX 3090, containerized. See docs/docker.md.
#
#   docker compose --profile single up -d     # low latency: MTP speculative decoding
#   docker compose --profile batch  up -d     # throughput
#   docker compose run --rm prepare           # just download + requantize the model
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in a .env file next to this file (never committed): VLLM_API_KEY=...,
# and any of the start-script variables (CTX, KV, MAX_LEN, MAX_SEQS, GPU_UTIL, VISION,
# SPEC_ATTN, DRAFT_TOKENS, EXTRA_ARGS, ...) — .env is passed straight into the
# container. Fastest single-user decode, if the card is yours alone (README,
# "If you are the only user"; the drafter it needs is already downloaded by
# prepare):
#
#   printf 'SPEC=dflash2\nDFLASH_TOKENS=15\nPREFIX_CACHE=1\n' >> .env
#
# On WSL2 add VLLM_WSL2_ENABLE_PIN_MEMORY=1 to that .env: SPEC=dflash2 forces vLLM's
# V2 model runner, whose UVA buffers are refused there by default, and the container
# aborts at "RuntimeError: UVA is not available" before loading weights (docs/docker.md).
# PORT and MODELS_DIR are read here: models live in ./models by default
# (the same layout as the venv install, so both can share one download).
# One GPU: run either "single" or "batch", not both.

x-qwen: &qwen
  # Prebuilt on every main push by .github/workflows/docker-image.yml; the
  # first `up` pulls it (~9.5 GB, pull_policy below) instead of the 20-minute
  # local build. `docker compose build` (or `up --build`) still builds the
  # identical image under the same tag name. Immutable per-commit tags:
  # ghcr.io/syv-ai/qwen38-27b-rtx3090:sha-<7>.
  image: ghcr.io/syv-ai/qwen38-27b-rtx3090:latest
  build: .
  pull_policy: missing
  ipc: host
  # Host-RAM containment. vLLM's stock loader materialises the checkpoint in host
  # memory, and compressed-tensors copies it again to repack it (the NVFP4 loader
  # pads and swizzles the scales). Loading a 20.6 GB checkpoint that way took this
  # box's 91 GiB and its 45 GiB of swap on 2026-09-15 and left 141 processes to the
  # kernel's global OOM killer. The cap keeps that inside the container's own
  # cgroup: it dies of its own OOM instead of taking the desktop with it. 48 GiB is
  # ~2.8x the shipped W4A16 checkpoint and leaves the desktop the ~20 GiB it uses.
  #
  # oom_score_adj is the other half and it was the real defect: systemd user
  # services run at 200 and this container ran at 0, so the kernel spent its time
  # killing 24 MB daemons while the process holding 78 GiB of anonymous memory was
  # the last candidate. At 500 the container is the first victim instead.
  mem_limit: ${QWEN_MEM_LIMIT:-48g}
  memswap_limit: ${QWEN_MEM_LIMIT:-48g}
  oom_score_adj: 500
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
    # Cap flashinfer/ninja JIT parallelism: each cicc peaks around 4.5 GB and the
    # default job count (16 on this host) needs ~72 GB, which OOMs the machine and
    # kills the build before it can populate the cache in the qwen-cache volume.
    # With 4 jobs the compile finishes once and later starts reuse the cache.
    MAX_JOBS: "4"
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - qwen-cache:/cache

x-serve: &serve
  <<: *qwen
  ports:
    - "${PORT:-18020}:${PORT:-18020}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-18020}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

services:
  prepare:
    <<: *qwen
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single

  batch:
    <<: *serve
    profiles: [batch]
    command: batch

volumes:
  qwen-cache:
